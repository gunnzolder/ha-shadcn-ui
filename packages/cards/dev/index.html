<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSU cards — playground</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
      body.dark { background: #0b0b0c; color: #fafafa; }
      .bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #8884; font-size: 13px; position: sticky; top: 0; backdrop-filter: blur(8px); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 16px; align-items: start; max-width: 1100px; }
      .label { font: 12px ui-monospace, monospace; opacity: .6; margin-bottom: 6px; }
      select, button { font: inherit; }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Lovelace cards playground</strong>
      <span id="source"></span>
      <select id="scenario"></select>
      <label><input type="checkbox" id="dark" /> dark</label>
      <span style="margin-left:auto;opacity:.6">так картки бачать <code>hass</code> у Lovelace</span>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
